[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfl-kindle-visual-adapter"
version = "0.11.0"
description = "Read-only EPUB custody, explicit component routing, vertical-footprint budgets, and bounded visual adaptation probes"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5,<7",
  "Pillow>=10,<13",
  "playwright>=1.50,<2",
  "tinycss2>=1.3,<2",
  "cssselect2>=0.7,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
mfl-adapter = "mfl_adapter.__main__:main"
[tool.setuptools.packages.find]
include = ["mfl_adapter*"]
